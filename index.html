<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Hunter Posten Photography</title>
  <link rel="stylesheet" href="styles/styles.css" />
</head>

<body>

  <div class="header">
    <h1>Hunter Posten</h1>
    <p>Software Engineer • Hobbyist Photographer • Twin Cities, MN</p>
  </div>

  <div class="nav">
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
  </div>

  <div id="collections" class="nav"></div>

  <div id="gallery" class="grid"></div>

  <script src="js/viewer.js"></script>
  <script src="js/gallery.js"></script>

 <script>
  fetch("generated/collections.json")
    .then(r => {
      if (!r.ok) throw new Error("Could not find collections.json");
      return r.json();
    })
    .then(cols => {
      const el = document.getElementById("collections");

      cols.forEach(c => {
        const link = document.createElement("a");
        // Ensure this points to your collection page correctly
        link.href = `collection?name=${encodeURIComponent(c.name)}`;
        link.textContent = c.name;

        el.appendChild(link);
      });
    })
    .catch(err => console.error("Error loading collections:", err));
</script>

</body>
</html>
